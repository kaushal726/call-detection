name: Build Venue APK

on:
  workflow_dispatch:
    inputs:
      pub_id:
        description: "Publisher / Venue ID to bake into the app"
        required: true
        default: "762"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUB_ID: ${{ github.event.inputs.pub_id }}
      S3_BUCKET: ${{ secrets.APK_S3_BUCKET }}
      S3_PREFIX: venue-apks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate pub_id
        run: |
          if ! [[ "$PUB_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::pub_id must be alphanumeric/dash/underscore (got: '$PUB_ID')"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease -PPUB_ID="$PUB_ID"

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/zillout-venue-$PUB_ID.apk"

      - name: Upload APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: zillout-venue-${{ env.PUB_ID }}
          path: dist/zillout-venue-${{ env.PUB_ID }}.apk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload APK to S3
        run: |
          aws s3 cp "dist/zillout-venue-$PUB_ID.apk" \
            "s3://$S3_BUCKET/$S3_PREFIX/zillout-venue-$PUB_ID.apk" \
            --content-type application/vnd.android.package-archive
          echo "Uploaded to s3://$S3_BUCKET/$S3_PREFIX/zillout-venue-$PUB_ID.apk" >> "$GITHUB_STEP_SUMMARY"
